and Ollama (ollama/ollama). Shapes and vendor colors are preserved.
Sources, terms and required notices: ../design/vendor-icons.md.
No external image/font/script requests are needed to render this figure.
Generic waveform, identity, document and review glyphs are original diagram artwork. -->
