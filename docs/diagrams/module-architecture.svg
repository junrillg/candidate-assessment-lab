<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1280" role="img" aria-labelledby="module-architecture-title module-architecture-desc">
<title id="module-architecture-title">Modules and data ownership</title>
<desc id="module-architecture-desc">One .NET process contains Access, Assessments and Evaluation; each uses its own EF Core context and PostgreSQL schema, Evaluation calls the Assessments read contract, and an external Kafka broker carries outbox IDs to durable jobs.</desc>
