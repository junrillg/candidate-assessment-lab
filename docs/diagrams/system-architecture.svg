<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="system-architecture-title system-architecture-desc"><title id="system-architecture-title">Local runtime and deployment architecture</title><desc id="system-architecture-desc">A local browser calls one .NET app container, which uses PostgreSQL, a Kafka broker, a private transcription container and host Ollama, with named volumes retaining application data.</desc>
