name: candidate-assessment-lab

x-app: &app
  image: candidate-assessment-lab/app:${APP_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile
  environment: &app-environment
    ASPNETCORE_URLS: http://+:8080
    ASPNETCORE_ENVIRONMENT: Development
    ConnectionStrings__Database: Host=postgres;Database=assessment;Username=assessment;Password=${POSTGRES_PASSWORD:?Run make configure}
    Kafka__BootstrapServers: kafka:9092
    Kafka__Topic: assessment.processing.v1
    Storage__Root: /var/lib/assessment/recordings
    DataProtection__Path: /var/lib/assessment/keys
    Providers__OllamaUrl: http://host.docker.internal:11434
    Providers__Model: ${OLLAMA_MODEL:-llama3.2:latest}
    Providers__TranscriptionUrl: http://transcription:8081
    Seed__CredentialsPath: /run/credentials.json
  extra_hosts:
    - host.docker.internal:host-gateway
  volumes:
    - recordings:/var/lib/assessment/recordings
    - session-keys:/var/lib/assessment/keys
  init: true
  stop_grace_period: 35s
  logging:
    options:
      max-size: 10m
      max-file: '3'

services:
  app:
    <<: *app
    ports:
      - 127.0.0.1:${APP_PORT:-5188}:8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/health/ready]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    <<: *app
    command: [--migrate]
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *app
    user: '0:0'
    command: [--seed]
    profiles: [tools]
    volumes:
      - ./.local/credentials.json:/run/credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: assessment
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make configure}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55438}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U assessment -d assessment']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-19098}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: candAssessmentLab000001
    ports:
      - 127.0.0.1:${KAFKA_PORT:-19098}:9094
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 15s
    restart: unless-stopped

  transcription:
    image: candidate-assessment-lab/transcription:local
    build:
      context: ./infra/transcription
    environment:
      WHISPER_MODEL: /models/ggml-base.bin
      WHISPER_THREADS: '2'
    volumes:
      - whisper-models:/models
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8081/health", timeout=2)']
      interval: 15s
      timeout: 3s
      retries: 40
      start_period: 10m
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  recordings:
  session-keys:
  whisper-models:
